<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>獎金動態分配工具</title><style>
:root{font-family:system-ui,'Microsoft JhengHei',sans-serif;color:#1c3049;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:1160px;margin:auto;padding:22px}h1{font-size:25px;margin:0}h2{font-size:18px;margin:0 0 14px}p{margin:6px 0;color:#64748b}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.panel{background:white;border:1px solid #e0e7ef;border-radius:15px;padding:18px;margin-top:14px;box-shadow:0 2px 12px #182b4207}.settings{display:flex;flex-wrap:wrap;gap:12px;align-items:end}.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:#62748b}.field input,.field select{font:inherit;font-size:16px;border:1px solid #d5deeb;border-radius:9px;padding:9px;background:#fff;color:#1c3049;width:150px}.field select{width:115px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.stat{padding:13px;border-radius:12px;background:#f0f5fc}.stat small{color:#63738a}.stat b{display:block;font-size:23px;margin-top:5px}.stat.em{background:#e9f7f0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}.dept{border:1px solid #dce5ef;border-radius:13px;padding:14px;min-width:0}.depthead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.depthead input{font-weight:700;font-size:17px;border:0;border-bottom:1px dashed #a4b6ca;width:60%;padding:5px;background:transparent;color:inherit}.sub{font-size:12px;color:#64748b}.person{border-top:1px solid #edf1f6;padding:11px 0}.personhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.personhead input{border:0;border-bottom:1px dashed #c5d1de;width:110px;font:inherit;padding:4px;color:inherit}.controls{display:grid;grid-template-columns:42px 1fr 42px;gap:6px;align-items:center;margin:7px 0}.controls button{padding:7px 0}.controls input[type=range]{width:100%;accent-color:#2563a8}.btn{border:0;border-radius:8px;background:#e9f0f9;color:#20528a;font-weight:700;font-size:16px;cursor:pointer;padding:9px 12px}.btn:disabled{opacity:.25;cursor:not-allowed}.primary{background:#245d9f;color:white}.money{font-weight:750;font-variant-numeric:tabular-nums}.split{display:flex;align-items:center;justify-content:space-between;gap:8px}.mini{font-size:12px}.quota{background:#f6f9fd;padding:10px;border-radius:10px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.bar{height:9px;background:#e8edf4;border-radius:20px;overflow:hidden;margin-top:10px}.bar span{display:block;height:100%;background:#3579bd}.hint{font-size:12px;color:#68798c}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{font-size:14px}.tabon{background:#245d9f;color:white}.summary{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid #e6ebf2;padding:10px;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}.muted{color:#738196}.warning{color:#ae402b}.footer{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.hidden{display:none!important}@media(max-width:700px){main{padding:12px}.stats{grid-template-columns:1fr 1fr}.stat b{font-size:19px}.field input{width:135px}.cards{grid-template-columns:1fr}}
</style></head><body><main><div class="top"><div><h1>獎金動態分配工具</h1><p>主管授權、單位分配、保留加碼，一頁完成</p></div><div class="footer"><button class="btn" onclick="downloadCSV()">匯出 CSV</button><button class="btn" onclick="resetAll()">重設</button></div></div><section class="panel"><h2>獎金設定</h2><div class="settings"><label class="field">總獎金（元）<input id="budget" type="number" min="0" step="5000"></label><label class="field">固定調整級距<strong>每次 5,000 元</strong></label><label class="field">單位數量<select id="count"></select></label><label class="field">每單位人數<select id="peopleCount"></select></label></div><div class="stats" id="stats"></div><div class="bar"><span id="progress"></span></div><p class="hint" id="status"></p></section><section class="panel"><div class="top"><h2>獎金分配</h2><div class="tabs"><button class="btn tabon" id="modeManager" onclick="setMode('manager')">① 單位主管分配</button><button class="btn" id="modeExtra" onclick="setMode('extra')">② 處長加碼</button></div></div><p class="hint" id="modeHelp"></p><div class="cards" id="cards"></div></section><section class="panel"><div class="top"><h2>分配明細</h2><button class="btn" onclick="toggleSummary()" id="detailToggle">展開明細</button></div><div class="summary hidden" id="details"><table><thead><tr><th>單位／同仁</th><th>主管分配</th><th>處長加碼</th><th>合計</th></tr></thead><tbody id="tbody"></tbody></table></div></section><p class="hint">資料僅儲存在目前瀏覽器的本機儲存空間；匯出前請確認個人獎金資訊的保密需求。金額不會自動上傳。</p></main><script>
const KEY='bonus_fixed5000_v3';const money=n=>'NT$ '+Math.round(n).toLocaleString('zh-TW');const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fresh=()=>({budget:100000,step:5000,peopleCount:3,mode:'manager',depts:Array.from({length:3},(_,i)=>({name:`第${i+1}科`,quota:30000,people:Array.from({length:3},(_,j)=>({name:`同仁${j+1}`,manager:0,extra:0}))}))});let d;try{d=JSON.parse(localStorage.getItem(KEY))||fresh()}catch{d=fresh()}if(!d.depts||!Array.isArray(d.depts))d=fresh();const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);const usedQuota=()=>sum(d.depts,x=>x.quota);const usedManager=x=>sum(x.people,p=>p.manager);const usedExtra=()=>sum(d.depts,x=>sum(x.people,p=>p.extra));const managerTotal=()=>sum(d.depts,usedManager);const remaining=()=>d.budget-managerTotal()-usedExtra();const reserve=()=>d.budget-usedQuota();function save(){localStorage.setItem(KEY,JSON.stringify(d))}function changeAmount(i,j,type,desired){let x=d.depts[i],p=j==null?null:x.people[j],step=d.step;desired=Math.max(0,Math.round(desired/step)*step);if(type==='quota'){let min=usedManager(x),max=Math.max(min,d.budget-usedQuota()+x.quota);x.quota=Math.max(min,Math.min(max,desired))}else if(type==='manager'){let max=Math.max(p.manager,x.quota-usedManager(x)+p.manager);p.manager=Math.min(max,desired)}else{let max=Math.max(p.extra,reserve()-usedExtra()+p.extra);p.extra=Math.min(max,desired)}save();render()}function buttons(i,j,type,value,max){let unit=d.step,allowed=Math.max(value,max),sliderMax=Math.max(unit,Math.ceil(allowed/unit)*unit);return `<div class="controls"><button class="btn" ${value<unit?'disabled':''} onclick="changeAmount(${i},${j},'${type}',${value-unit})">−</button><input aria-label="調整金額" type="range" min="0" max="${sliderMax}" step="${unit}" value="${value}" oninput="changeAmount(${i},${j},'${type}',Number(this.value))"><button class="btn" ${value+unit>max?'disabled':''} onclick="changeAmount(${i},${j},'${type}',${value+unit})">＋</button></div>`}function render(){d.step=5000;$('budget').value=d.budget;$('count').value=d.depts.length;$('peopleCount').value=d.peopleCount;let total=managerTotal()+usedExtra(),r=reserve(),free=remaining();$('stats').innerHTML=[['總獎金',money(d.budget)],['主管已分配',money(managerTotal())],['處長已加碼',money(usedExtra())],['尚未分配',money(free)]].map((v,i)=>`<div class="stat ${i===3?'em':''}"><small>${v[0]}</small><b>${v[1]}</b></div>`).join('');$('progress').style.width=(d.budget?Math.min(100,100*total/d.budget):0)+'%';$('status').textContent=`各單位授權合計 ${money(usedQuota())} ｜ 處長保留額度 ${money(r)} ｜ 可加碼餘額 ${money(r-usedExtra())}`;let m=d.mode==='manager';$('modeManager').classList.toggle('tabon',m);$('modeExtra').classList.toggle('tabon',!m);$('modeHelp').textContent=m?'先分配各單位主管可運用的額度，再由主管分給同仁。':'加碼僅使用處長保留額度，不影響主管原先分配。';$('cards').innerHTML=d.depts.map((x,i)=>{let avail=d.budget-usedQuota()+x.quota,mg=usedManager(x),head=`<div class="depthead"><input aria-label="單位名稱" value="${esc(x.name)}" onchange="renameDept(${i},this.value)"><span class="sub">${x.people.length} 人</span></div>`;let quota=m?`<div class="quota"><div class="split"><b>主管授權額度</b><span class="money">${money(x.quota)}</span></div>${buttons(i,null,'quota',x.quota,avail)}<div class="sub">主管已分配 ${money(mg)}，可再分配 ${money(x.quota-mg)}</div></div>`:`<div class="quota split"><span>處長加碼合計</span><b>${money(sum(x.people,p=>p.extra))}</b></div>`;let people=x.people.map((p,j)=>{let type=m?'manager':'extra',val=p[type],max=m?x.quota-mg+val:r-usedExtra()+val;return `<div class="person"><div class="personhead"><input aria-label="同仁姓名" value="${esc(p.name)}" onchange="renamePerson(${i},${j},this.value)"><span class="money">${money(val)}</span></div>${buttons(i,j,type,val,max)}<div class="split sub"><span>${m?'主管分配':'處長加碼'}</span><span>個人累計 ${money(p.manager+p.extra)}</span></div></div>`}).join('');return `<article class="dept">${head}${quota}${people}</article>`}).join('');let rows=[];d.depts.forEach(x=>{x.people.forEach(p=>rows.push(`<tr><td>${esc(x.name)}／${esc(p.name)}</td><td>${money(p.manager)}</td><td>${money(p.extra)}</td><td><b>${money(p.manager+p.extra)}</b></td></tr>`));rows.push(`<tr><td><b>${esc(x.name)}小計</b></td><td>${money(usedManager(x))}</td><td>${money(sum(x.people,p=>p.extra))}</td><td><b>${money(usedManager(x)+sum(x.people,p=>p.extra))}</b></td></tr>`)});rows.push(`<tr><td><b>合計</b></td><td>${money(managerTotal())}</td><td>${money(usedExtra())}</td><td><b>${money(total)}</b></td></tr>`);$('tbody').innerHTML=rows.join('')};function renameDept(i,v){d.depts[i].name=v.trim()||`單位${i+1}`;save();render()}function renamePerson(i,j,v){d.depts[i].people[j].name=v.trim()||`同仁${j+1}`;save();render()}function setMode(v){d.mode=v;save();render()}function toggleSummary(){$('details').classList.toggle('hidden');$('detailToggle').textContent=$('details').classList.contains('hidden')?'展開明細':'收合明細'}function resizeDepts(n){while(d.depts.length<n)d.depts.push({name:`單位${d.depts.length+1}`,quota:0,people:Array.from({length:d.peopleCount},(_,j)=>({name:`同仁${j+1}`,manager:0,extra:0}))});if(n<d.depts.length){let removed=d.depts.slice(n);if(removed.some(x=>x.quota||sum(x.people,p=>p.manager+p.extra))&&!confirm('移除的單位已有分配資料，確定要刪除？')){render();return}d.depts.length=n}save();render()}function resizePeople(n){if(n<d.peopleCount&&d.depts.some(x=>x.people.slice(n).some(p=>p.manager||p.extra))&&!confirm('部分即將移除的同仁已有獎金，確定刪除？')){render();return}d.peopleCount=n;d.depts.forEach(x=>{while(x.people.length<n)x.people.push({name:`同仁${x.people.length+1}`,manager:0,extra:0});x.people.length=n});save();render()}$('budget').addEventListener('change',e=>{let n=Math.max(0,Math.floor(Number(e.target.value)||0));if(n<usedQuota()||n<managerTotal()+usedExtra()){alert('總額不得小於目前授權或已分配金額，請先調整分配。');render();return}d.budget=n;save();render()});$('count').addEventListener('change',e=>resizeDepts(Number(e.target.value)));$('peopleCount').addEventListener('change',e=>resizePeople(Number(e.target.value)));for(let i=1;i<=10;i++)$('count').add(new Option(i+' 個單位',i));for(let i=1;i<=15;i++)$('peopleCount').add(new Option(i+' 人',i));function downloadCSV(){let rows=[['單位','同仁','主管分配金額（元）','處長加碼金額（元）','獎金合計（元）']];d.depts.forEach(x=>x.people.forEach(p=>rows.push([x.name,p.name,p.manager,p.extra,p.manager+p.extra])));rows.push(['總計','',managerTotal(),usedExtra(),managerTotal()+usedExtra()]);let csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='獎金分配明細.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function resetAll(){if(confirm('確定清除目前方案並恢復預設值？')){d=fresh();save();render()}}render();
</script></body></html>
