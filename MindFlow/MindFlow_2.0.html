<body>
<div class="app">

<script>
(()=>{'use strict';

const sample=`# Google 簡報 AI 自動套用企業範本
- 企業簡報常見問題與流程優勢

function node(text,depth=0,parent=null){return {id:++nodeSeq,text,depth,parent,children:[],collapsed:false,color:0}}
function parse(t){const lines=t.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n').split('\n'),entries=[];let inFence=false;

if(!entries.length)throw Error('找不到可辨識的心智圖內容');let title=entries[0].text.replace(/^\*\*(.*?)\*\*$/,'$1'),start=1;if(entries[0].type==='list') {title='心智圖';start=0}const r=node(title),stack=[{depth:-1,n:r}],headings=[];let previous=null,baseIndent=null;
for(let i=start;i<entries.length;i++){const e=entries[i];if(e.type==='heading'){const d=Math.max(1,e.level-(entries[0].type==='heading'?entries[0].level:0));while(headings.length&&headings.at(-1).level>=e.level)headings.pop();const parent=headings.length?headings.at(-1).n:r;const n=node(e.text,d,parent);parent.children.push(n);headings.push({level:e.level,n});previous=n;continue}
if(e.type==='list'){if(baseIndent===null||e.indent<baseIndent)baseIndent=e.indent;const depth=Math.max(1,Math.floor((e.indent-baseIndent)/2)+1);while(stack.length>1&&stack.at(-1).depth>=depth)stack.pop();let parent=stack.at(-1).n;if(headings.length&&stack.length===1)parent=headings.at(-1).n;const n=node(e.text,parent.depth+1,parent);parent.children.push(n);stack.push({depth,n});previous=n;continue}
if(e.type==='plain'){if(previous && entries[i-1]?.type==='plain'){previous.text+=' '+e.text}else{const parent=headings.length?headings.at(-1).n:r;const n=node(e.text,parent.depth+1,parent);parent.children.push(n);previous=n}}}

function visibleCount(n){return 1+(!n.collapsed?n.children.reduce((a,c)=>a+visibleCount(c),0):0)}
function splitLines(t,max){let result=[];for(const paragraph of t.split('\n')){let current='',width=0;for(const ch of paragraph){const w=/[\x00-\xff]/.test(ch)?0.55:1;if(current&&width+w>max){result.push(current);current='';width=0}current+=ch;width+=w}result.push(current||' ')}return result.slice(0,12)}

function compute(){positions.clear();if(!root)return;const gap=16,rootGap=110,levelGap=72;let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;const vertical=direction==='vertical';
function primarySize(n){return vertical?n._box.h:n._box.w}function crossSize(n){return vertical?n._box.w:n._box.h}
function calc(n){n._box=measure(n);const ch=n.collapsed?[]:n.children;ch.forEach(calc);n._sub=Math.max(crossSize(n),ch.reduce((a,c)=>a+c._sub,0)+Math.max(0,ch.length-1)*gap)}
function put(n,primary,cross,dir){const x=vertical?cross:primary,y=vertical?primary:cross;positions.set(n.id,{x,y,dir});minX=Math.min(minX,x-n._box.w/2);maxX=Math.max(maxX,x+n._box.w/2);minY=Math.min(minY,y-n._box.h/2);maxY=Math.max(maxY,y+n._box.h/2);if(n.collapsed||!n.children.length)return;const kids=n.children,total=kids.reduce((a,c)=>a+c._sub,0)+(kids.length-1)*gap;let cursor=cross-total/2;for(const c of kids){const center=cursor+c._sub/2;put(c,primary+dir*(primarySize(n)/2+levelGap+primarySize(c)/2),center,dir);cursor+=c._sub+gap}}

function el(tag,attrs={},parent){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,String(v));if(parent)parent.appendChild(e);return e}

$('nodeCount').textContent=all.length+' 個節點'+(all.length<visibleCountAll(root)?'（部分收合）':'');$('empty').classList.toggle('hidden',!!all.length);updateCamera()}
function selectedNode(){return findNode(root,chosen)||root}function findNode(n,id){if(!n)return null;if(n.id===id)return n;for(const c of n.children){const v=findNode(c,id);if(v)return v}return null}

function focusNode(n,move=true){if(!n)return;chosen=n.id;let a=n.parent;while(a){a.collapsed=false;a=a.parent}render();refreshFocus();if(mode==='focus'&&move)fitFocus(n)}
function refreshFocus(){if(!root)return;const n=selectedNode(),path=[];let p=n;while(p){path.unshift(p.text);p=p.parent} $('crumbs').textContent=path.join(' › ');$('crumbs').style.display=$('showPath').checked?'block':'none';const info=$('focusInfo');info.classList.toggle('visible',mode==='focus');info.innerHTML='';const title=document.createElement('strong');title.textContent=n.text;const detail=document.createElement('small');detail.textContent=`第 ${n.depth} 層 · ${n.children.length} 個子節點`+(n.parent?` · 同層 ${n.parent.children.indexOf(n)+1}/${n.parent.children.length}`:'');info.append(title,detail);workspace.classList.toggle('focusmode',mode==='focus');$('focusHelp').style.display=mode==='focus'?'block':'none'}
function fitFocus(n){const pos=positions.get(n.id);if(!pos)return;const r=workspace.getBoundingClientRect(),group=[n];if(n.parent)group.push(n.parent);group.push(...(n.collapsed?[]:n.children.slice(0,8)));const pp=group.map(c=>positions.get(c.id)).filter(Boolean),minX=Math.min(...pp.map(p=>p.x)),maxX=Math.max(...pp.map(p=>p.x)),minY=Math.min(...pp.map(p=>p.y)),maxY=Math.max(...pp.map(p=>p.y));const ww=maxX-minX+Math.max(300,n._box.w)+110,hh=maxY-minY+Math.max(160,n._box.h)+100;const targetScale=$('autoZoom').checked?Math.min(1.6,Math.max(.6,Math.min((r.width-100)/ww,(r.height-170)/hh))):scale;const tx=r.width*.50-pos.x*targetScale,ty=r.height*.52-pos.y*targetScale;animateCamera(tx,ty,targetScale)}
function animateCamera(x,y,z){cancelAnimationFrame(cameraAnimation);const start=performance.now(),oldX=pan.x,oldY=pan.y,oldZ=scale;function step(t){const f=Math.min(1,(t-start)/240),e=f*f*(3-2*f);pan.x=oldX+(x-oldX)*e;pan.y=oldY+(y-oldY)*e;scale=oldZ+(z-oldZ)*e;updateCamera();if(f<1)cameraAnimation=requestAnimationFrame(step)}cameraAnimation=requestAnimationFrame(step)}
function navigate(key){if(!root)return;const n=selectedNode();let target=null;if(key==='ArrowUp')target=n.parent;else if(key==='ArrowDown'){if(n.children.length){n.collapsed=false;target=n.children[0]}}else if(key==='ArrowLeft'||key==='ArrowRight'){if(n.parent){const arr=n.parent.children,i=arr.indexOf(n)+(key==='ArrowLeft'?-1:1);target=arr[i]}}else if(key==='Home')target=root;else if(key==='Enter'){n.collapsed=!n.collapsed;render();refreshFocus();fitFocus(n);return}else if(key==='Escape')target=n.parent;if(target)focusNode(target,true)}
function depthSet(n,d,max){n.collapsed=d>=max&&n.children.length>0;n.children.forEach(c=>depthSet(c,d+1,max))}
function visibleCountAll(n){return 1+n.children.reduce((a,c)=>a+visibleCountAll(c),0)}
function updateCamera(){cam.setAttribute('transform',`translate(${pan.x} ${pan.y}) scale(${scale})`);$('zoomLabel').textContent=Math.round(scale*100)+'%'}
function fit(){if(!layoutBounds)return;const r=workspace.getBoundingClientRect(),w=layoutBounds.maxX-layoutBounds.minX+110,h=layoutBounds.maxY-layoutBounds.minY+110;scale=Math.max(.12,Math.min(2.0,(r.width-50)/w,(r.height-50)/h));pan.x=r.width/2-(layoutBounds.minX+layoutBounds.maxX)/2*scale;pan.y=r.height/2-(layoutBounds.minY+layoutBounds.maxY)/2*scale;updateCamera()}
function rebuild(){try{nodeSeq=0;root=parse(source.value);chosen=root.id;render();fit();refreshFocus();$('status').textContent='✓ 已解析 '+visibleCountAll(root)+' 個節點；雙擊節點可編輯文字。';$('side').classList.remove('open')}catch(e){$('status').textContent='⚠ '+e.message;alert(e.message)}}
function zoom(factor,x=workspace.clientWidth/2,y=workspace.clientHeight/2){const old=scale;scale=Math.max(.1,Math.min(3,scale*factor));pan.x=x-(x-pan.x)*scale/old;pan.y=y-(y-pan.y)*scale/old;updateCamera()}
svg.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('.node'))return;drag={x:e.clientX,y:e.clientY,px:pan.x,py:pan.y};svg.setPointerCapture(e.pointerId)});svg.addEventListener('pointermove',e=>{if(!drag)return;pan.x=drag.px+e.clientX-drag.x;pan.y=drag.py+e.clientY-drag.y;updateCamera()});svg.addEventListener('pointerup',()=>drag=null);svg.addEventListener('pointercancel',()=>drag=null);svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoom(e.deltaY<0?1.1:.9,e.clientX-r.left,e.clientY-r.top)},{passive:false});
function stringify(n){const a=['# '+n.text];function walk(p,d){for(const c of p.children){a.push('  '.repeat(Math.max(0,d-1))+'- '+c.text.replace(/\n/g,' '));walk(c,d+1)}}walk(n,1);return a.join('\n')+'\n'}
$('drawBtn').onclick=rebuild;$('sampleBtn').onclick=()=>{source.value=sample;rebuild()};$('fitBtn').onclick=fit;$('zoomIn').onclick=()=>zoom(1.2);$('zoomOut').onclick=()=>zoom(1/1.2);$('menuBtn').onclick=()=>{$('side').classList.toggle('open');$('settings').classList.remove('open')};
$('collapseBtn').onclick=()=>{if(!root)return;root.children.forEach(n=>n.collapsed=true);render();fit()};$('expandBtn').onclick=()=>{if(!root)return;function rec(n){n.collapsed=false;n.children.forEach(rec)}rec(root);render();fit()};
$('saveEdit').onclick=()=>{if(!activeEdit)return;activeEdit.text=$('editText').value.trim()||activeEdit.text;source.value=stringify(root);render();refreshFocus();$('editDialog').close()};$('cancelEdit').onclick=()=>$('editDialog').close();

$('svgBtn').onclick=()=>{const v=exportSVG();if(v)download(v.xml,'心智圖.svg','image/svg+xml;charset=utf-8')};$('pngBtn').onclick=()=>{const v=exportSVG();if(!v)return;const url=URL.createObjectURL(new Blob([v.xml],{type:'image/svg+xml;charset=utf-8'})),img=new Image();img.onload=()=>{const ratio=Math.min(2,7000/Math.max(v.W,v.H)),c=document.createElement('canvas');c.width=Math.round(v.W*ratio);c.height=Math.round(v.H*ratio);const ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{if(b)download(b,'心智圖.png','image/png');URL.revokeObjectURL(url)},'image/png')};img.onerror=()=>{URL.revokeObjectURL(url);alert('PNG 匯出失敗，請使用 SVG 匯出')};img.src=url};
$('exportMdBtn').onclick=()=>{if(root)download(stringify(root),'心智圖.md','text/markdown;charset=utf-8')};
async function loadFile(file){if(!file)return;if(!/\.(txt|md|markdown)$/i.test(file.name)){alert('請選擇 .txt 或 .md 格式');return}source.value=await file.text();rebuild()}
$('fileInput').onchange=e=>loadFile(e.target.files[0]);const dz=$('dropzone');['dragenter','dragover'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.add('drag')}));['dragleave','drop'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.remove('drag')}));dz.addEventListener('drop',e=>loadFile(e.dataTransfer.files[0]));document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&document.activeElement===source){rebuild();return}if(mode!=='focus'||$('editDialog').open||['TEXTAREA','INPUT','SELECT'].includes(document.activeElement?.tagName))return;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Home','Enter','Escape'].includes(e.key)){e.preventDefault();navigate(e.key)}});
$('settingsBtn').onclick=()=>{$('settings').classList.toggle('open');$('side').classList.remove('open')};$('closeSettings').onclick=()=>$('settings').classList.remove('open');$('openImport').onclick=()=>{$('settings').classList.remove('open');$('side').classList.add('open')};$('resetView').onclick=fit;
function configure(group,value){document.querySelectorAll(`[data-${group}]`).forEach(b=>b.classList.toggle('active',b.dataset[group]===value))}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;configure('mode',mode);refreshFocus();render();if(mode==='focus')fitFocus(selectedNode());else fit();$('settings').classList.remove('open')});
document.querySelectorAll('[data-direction]').forEach(b=>b.onclick=()=>{direction=b.dataset.direction;configure('direction',direction);render();mode==='focus'?fitFocus(selectedNode()):fit()});
